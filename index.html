<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center pt-6 font-sans select-none">

  <h1 class="text-2xl md:text-3xl font-normal text-gray-800 mb-6 tracking-tight">
    Página Principal
  </h1>

  <!-- 3 Cards -->
  <main class="flex flex-wrap items-center justify-center gap-5 w-full mb-8 px-4">

    <!-- Card 1 -->
    <div class="card-scene w-36 h-36">
      <div data-target="page1.html" class="card-interactive card-object relative block w-full h-full rounded-2xl shadow-sm cursor-pointer">
        <div class="face-hidden absolute inset-0 bg-[#8cb4e6] text-white flex items-center justify-center rounded-2xl shadow-inner">
          <span class="text-xl font-medium tracking-wide">page1</span>
        </div>
        <div class="face-hidden card-back absolute inset-0 bg-[#4a7ec4] text-white flex flex-col items-center justify-center rounded-2xl p-2 text-center shadow-md">
          <span class="text-[9px] uppercase tracking-wider text-blue-200 font-bold mb-0.5">Ver</span>
          <span class="text-xs font-bold mb-1.5 leading-tight">Inbox Messages</span>
          <span class="text-[9px] bg-white/20 px-2 py-0.5 rounded-full">Mostrar</span>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card-scene w-36 h-36">
      <div data-target="page2.html" class="card-interactive card-object relative block w-full h-full rounded-2xl shadow-sm cursor-pointer">
        <div class="face-hidden absolute inset-0 bg-[#8cb4e6] text-white flex items-center justify-center rounded-2xl shadow-inner">
          <span class="text-xl font-medium tracking-wide">page2</span>
        </div>
        <div class="face-hidden card-back absolute inset-0 bg-[#4a7ec4] text-white flex flex-col items-center justify-center rounded-2xl p-2 text-center shadow-md">
          <span class="text-[9px] uppercase tracking-wider text-blue-200 font-bold mb-0.5">Ver</span>
          <span class="text-xs font-bold mb-1.5 leading-tight">Playas & Clima</span>
          <span class="text-[9px] bg-white/20 px-2 py-0.5 rounded-full">Mostrar</span>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card-scene w-36 h-36">
      <div data-target="page3.html" class="card-interactive card-object relative block w-full h-full rounded-2xl shadow-sm cursor-pointer">
        <div class="face-hidden absolute inset-0 bg-[#8cb4e6] text-white flex items-center justify-center rounded-2xl shadow-inner">
          <span class="text-xl font-medium tracking-wide">page3</span>
        </div>
        <div class="face-hidden card-back absolute inset-0 bg-[#4a7ec4] text-white flex flex-col items-center justify-center rounded-2xl p-2 text-center shadow-md">
          <span class="text-[9px] uppercase tracking-wider text-blue-200 font-bold mb-0.5">Ver</span>
          <span class="text-xs font-bold mb-1.5 leading-tight">Tienda Plantas</span>
          <span class="text-[9px] bg-white/20 px-2 py-0.5 rounded-full">Mostrar</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Contenedor dinámico 100% ancho -->
  <section class="w-full flex-1 bg-white border-t border-gray-300 shadow-inner flex flex-col">
    <div class="bg-gray-800 text-white px-6 py-2.5 flex justify-between items-center text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>
        <span id="visor-titulo" class="ml-3 font-mono text-gray-300">page1.html</span>
      </div>
      <a id="btn-redirigir" href="page1.html" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded transition text-[11px] font-semibold">
        Abrir en pestaña nueva ↗
      </a>
    </div>

    <iframe id="visor-iframe" src="page1.html" class="w-full h-[80vh] border-0"></iframe>
  </section>

  <!-- Script JS al final del body -->
  <script src="js/index.js"></script>
</body>
</html>
